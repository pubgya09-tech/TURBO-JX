name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        # Agar sizda keystore bo'lmasa, vaqtincha test uchun APK yasaymiz (release emas)
        # buildozer.spec ichida android.release_artifact = aab bo'lsa, u AAB yasaydi
        buildozer -v android debug

    - name: Upload APK/AAB
      uses: actions/upload-artifact@v4
      with:
        name: my-app-build
        path: bin/*.apk
        # Agar AAB yasayotgan bo'lsangiz, pastdagi qatorni ham qo'shishingiz mumkin:
        # path: bin/*.aab
