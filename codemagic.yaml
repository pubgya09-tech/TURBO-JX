workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 11
    scripts:
      - name: Install dependencies
        script: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y python3.11 python3.11-venv
          # Python 3.11 ni asosiy qilib belgilash
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          sudo update-alternatives --set python3 /usr/bin/python3.11
          # Kutubxonalarni o'rnatish
          python3 -m pip install --user --upgrade "buildozer==1.4.0" cython setuptools virtualenv
      - name: Build APK
        script: |
          export PATH=$PATH:~/.local/bin
          buildozer android debug
    artifacts:
      - bin/*.apk
