workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - default
    scripts:
      - name: Install dependencies
        script: |
          brew install python@3.10 openjdk@17
          pip3 install --user --upgrade buildozer cython virtualenv
      - name: Force P4A Version
        script: |
          # Buildozer xohlagan python-for-android versiyasini majburan o'rnatamiz
          export PATH=$PATH:~/Library/Python/3.10/bin
          pip3 install --user git+https://github.com/kivy/python-for-android.git@develop
      - name: Build with Buildozer
        script: |
          export PATH=$PATH:~/Library/Python/3.10/bin
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          # Buildozerni ishga tushirish
          buildozer -v android debug
    artifacts:
      - bin/*.apk
