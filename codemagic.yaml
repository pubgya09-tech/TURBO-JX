workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      java: 11
    scripts:
      - name: Install dependencies
        script: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y python3.11 python3.11-venv
          # Cython va boshqa kutubxonalarni Python 3.11 ga aniq o'rnatish
          python3.11 -m pip install --user --upgrade "buildozer==1.4.0" cython setuptools virtualenv
      - name: Build APK
        script: |
          export PATH=$PATH:~/.local/bin
          # Buildozer'ni Python 3.11 orqali ishga tushirish
          python3.11 -m buildozer android debug
    artifacts:
      - bin/*.apk
